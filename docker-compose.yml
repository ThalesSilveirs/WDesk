services:
  db:
    image: postgres:15
    restart: unless-stopped
    command: postgres -c shared_buffers=256MB -c max_connections=200 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=512MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    environment:
      - POSTGRES_DB=${DB_NAME:-whatsapp_saas}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  evolution-go:
    image: evoapicloud/evolution-go:latest
    container_name: evolution-go
    restart: unless-stopped
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      - SERVER_PORT=8080
      - GLOBAL_API_KEY=${EVOLUTION_API_TOKEN:-0f00f38b042ada23b3437e74b0141dd4d40ac50daf2afd9c8c524b79958a54cd}
      - POSTGRES_AUTH_DB=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/evogo_auth?sslmode=disable
      - POSTGRES_USERS_DB=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/evogo_users?sslmode=disable
      - WEBHOOK_ENABLED=true
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_URL=${WEBHOOK_GLOBAL_URL:-http://backend:8000/api/v1/webhooks/evolution}
      - WEBHOOK_GLOBAL_URL=${WEBHOOK_GLOBAL_URL:-http://backend:8000/api/v1/webhooks/evolution}
      - WEBHOOK_EVENTS=MESSAGE,READ_RECEIPT,HISTORY_SYNC,CALL,CONNECTION,QRCODE,MESSAGES_UPDATE,MESSAGES_UPSERT,CONNECTION_UPDATE
      - WEBHOOK_URL_MESSAGE=${WEBHOOK_GLOBAL_URL:-http://backend:8000/api/v1/webhooks/evolution}
      - WEBHOOK_URL_MESSAGES_UPSERT=${WEBHOOK_GLOBAL_URL:-http://backend:8000/api/v1/webhooks/evolution}
      - WEBHOOK_URL_CONNECTION_UPDATE=${WEBHOOK_GLOBAL_URL:-http://backend:8000/api/v1/webhooks/evolution}
      - LOG_LEVEL=WARN
      - REDIS_ENABLED=false
      - REDIS_URI=redis://redis:6379
      - CLIENT_NAME=evolution
      - AUTHENTICATION_TYPE=apikey
      - WEBHOOK_BASE64=true
      - DATABASE_SAVE_MESSAGES=false
      - DATABASE_CONNECTION_URI=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/evogo_users?sslmode=disable
      - WADEBUG=
      - LOGTYPE=console
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  backend:
    build: ./backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 2 --worker-class gthread --threads 4 --max-requests 1000 --max-requests-jitter 100 --timeout 60"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DEBUG=0
      - DB_HOST=db
      - REDIS_HOST=redis
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-go:8080}
      - EVOLUTION_API_TOKEN=${EVOLUTION_API_TOKEN:-0f00f38b042ada23b3437e74b0141dd4d40ac50daf2afd9c8c524b79958a54cd}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A core worker -l info -B --concurrency=2 --max-tasks-per-child=100 --max-memory-per-child=250000 --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-go:8080}
      - EVOLUTION_API_TOKEN=${EVOLUTION_API_TOKEN:-0f00f38b042ada23b3437e74b0141dd4d40ac50daf2afd9c8c524b79958a54cd}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  realtime:
    build: ./realtime
    restart: unless-stopped
    command: npm start
    volumes:
      - ./realtime:/app
      - /app/node_modules
    environment:
      - REDIS_HOST=redis
      - PORT=3000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - redis
    networks:
      - app-network
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - frontend
      - backend
      - realtime
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
