name: Deploy to Production (Locaweb)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 20m
          script: |
            cd /root/WDesk || cd ~/WDesk
            # Garantir swap de 2GB para absorver picos de build e evitar OOM Killer
            if [ $(free -m | awk '/^Swap:/ {print $2}') -eq 0 ]; then
              fallocate -l 2G /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile || true
            fi
            git fetch https://ThalesSilveirs:${{ secrets.MY_GITHUB_TOKEN }}@github.com/ThalesSilveirs/WDesk.git main
            git reset --hard FETCH_HEAD
            docker compose up -d --build --remove-orphans
            docker compose exec -T backend python manage.py migrate
            docker compose restart nginx frontend