server {
    listen 80 default_server;
    server_name _;

    # Frontend - acessível externamente
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API - apenas para rede interna (não exposta externamente)
    location /api/ {
        # Se quiser bloquear externamente
        deny all;
        return 403;
        
        # Para acesso interno (remova se quiser bloquear externamente)
        # proxy_pass http://backend:8000;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
    }

    # Socket.IO - apenas para rede interna
    location /socket.io/ {
        # Bloqueia externamente
        deny all;
        return 403;
        
        # Para acesso interno (remova se quiser bloquear externamente)
        # proxy_pass http://realtime:3000/socket.io/;
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "Upgrade";
        # proxy_set_header Host $host;
        # proxy_cache_bypass $http_upgrade;
    }
}